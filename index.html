<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>こどもまち会議</title>
<meta name="description" content="町長になって、みんなが暮らしやすい町をつくろう！考えて話し合う、こどものためのまちづくりゲーム。">
<meta name="theme-color" content="#f6eeda">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まち会議">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app"><!-- ここに各画面が描画されます --></div>
<nav id="bottom-nav"><!-- ここに下部タブが描画されます --></nav>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  // オフライン対応のための Service Worker 登録
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.error("Service Worker の登録に失敗しました", err);
      });
    });
  }
</script>
</body>
</html>
